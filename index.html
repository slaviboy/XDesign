<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Offline-first vector design editor. No account, no server, no network." />
    <title>XDesign</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      /*
       * Applied before the first paint, or the app flashes light and then
       * switches. It lives in <head> rather than <body> so it runs before the
       * body element exists, closing the last window in which a light frame
       * could paint. That is also why the preference is in localStorage — a
       * synchronous read — rather than in the async IndexedDB store.
       *
       * The try wraps ONLY the storage read. Wrapping the whole body would mean
       * a blocked localStorage (Safari private mode) skipped matchMedia too, so
       * the app would boot light on a dark OS — exactly the case 'system' is
       * meant to cover.
       *
       * Keep the key in sync with src/state/theme.ts.
       */
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('xdesign.theme')
        } catch (e) {
          /* Storage blocked — fall through to the OS preference. */
        }
        var prefersDark = false
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {
          /* No matchMedia — default to light. */
        }
        var theme = stored === 'dark' || (stored !== 'light' && prefersDark) ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
