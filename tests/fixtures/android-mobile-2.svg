<!--
  Reference SVG acceptance fixture — an Adobe XD export.

  Every distinct construct of the original file is here: its 16 gradients
  (including the one whose stops carry no stop-color, the one whose coordinates
  run outside 0..1, and the reversed one), the empty <pattern> referenced by a
  fill, the <clipPath> wrapping every element, nested groups with transforms,
  group-level fill/stroke that children override, rgba() colours, rounded rects,
  circles, text with tspans, and paths built from relative arcs.

  The original repeats four phone-key groups roughly a hundred times; those
  repetitions are reduced here, so this is ~125 elements rather than ~700. It is
  the same feature set, not the same element count.
-->
